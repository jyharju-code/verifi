name: Verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway PostgreSQL for the tests that need the real schema and its
    # migrations (tests/dbutil.py). Each test creates and drops its own database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: verifi
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U verifi"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VERIFI_TEST_DATABASE_URL: postgresql://verifi:ci-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: instances/verify-api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Verify API dependencies
        run: npm ci --prefix instances/verify-api
      - name: Verify the API contract
        run: npm test --prefix instances/verify-api
      - name: Compile Python services
        run: python -m compileall -q core
      - name: Test the core, including the database-backed tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate the production Compose model
        env:
          POSTGRES_PASSWORD: ci-password
          LITELLM_MASTER_KEY: ci-key
        run: >-
          docker compose -f deploy/docker-compose.yml
          --env-file .env.example
          --profile bot --profile edge --profile payments config -q
      - name: Build the core image
        run: docker build -f core/Dockerfile .
      - name: Build the Verify API image
        run: docker build -f instances/verify-api/Dockerfile instances/verify-api

  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the public production contract
        run: ./scripts/smoke-production.sh https://verifi.cloud
