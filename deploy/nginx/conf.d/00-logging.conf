# JSON access logging, request ids, and the real-client-ip trust boundary.
# Loaded before the server blocks (00- prefix) because log_format, geo, and
# set_real_ip_from are http-context directives.

# A request may only speak for a client through X-Forwarded-For when its actual
# TCP peer is one of our own proxies: loopback, the docker network, or the
# Tailscale CGNAT range. A public caller's peer is its own public address,
# never in this set, so it can never forge a trusted client ip.
geo $realip_remote_addr $fwd_trusted {
    default        0;
    127.0.0.1      1;
    ::1            1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
    100.64.0.0/10  1;
}

set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 100.64.0.0/10;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Referer is useful operationally, but its query may contain a token supplied
# by another site. Keep only the URL portion before the first question mark.
map $http_referer $safe_referer {
    default "";
    "~^(?<verifi_referer_without_query>[^?]*)" $verifi_referer_without_query;
}

# One line per request. escape=json quotes and escapes every value, so no field
# can break the JSON or inject a newline. remote_addr is the direct TCP peer;
# real_client is that peer after trusted-proxy correction; xff is the raw,
# untrusted header. path is $uri, which never carries the query string. No
# bodies, no query, and no secret headers are logged. The nginx image runs in
# UTC, so $time_iso8601 is a UTC timestamp.
log_format json_access escape=json
    '{'
    '"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"remote_addr":"$realip_remote_addr",'
    '"real_client":"$remote_addr",'
    '"xff":"$http_x_forwarded_for",'
    '"forwarded_trusted":"$fwd_trusted",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"bytes_received":$request_length,'
    '"bytes_sent":$bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"tls":"$ssl_protocol",'
    '"user_agent":"$http_user_agent",'
    '"referer":"$safe_referer"'
    '}';
